security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/signup, roles: PUBLIC_ACCESS }
        - { path: ^/\.well-known/, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/(register|token|introspect), roles: PUBLIC_ACCESS }
        - { path: ^/internal/, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/authorize, roles: ROLE_USER }
        - { path: ^/$, roles: ROLE_USER }
